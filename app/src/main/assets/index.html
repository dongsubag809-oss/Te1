<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111a30;color:white;font-family:sans-serif;text-align:center;padding:18px}h1{color:#ffdb75}.balls{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:30px 0}.ball{background:#e7a935;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-weight:bold;color:#171717;font-size:20px}button{background:#46b6a9;border:0;padding:15px 28px;border-radius:12px;font-size:18px;font-weight:bold}small{color:#b7c2d8}textarea{width:90%;height:120px;margin-top:20px;background:#243350;color:white;padding:10px}</style></head><body><h1>🎰 복권 추첨기 Te1</h1><p>게임형 번호 추첨</p><div class="balls" id="balls"></div><button onclick="draw()">추첨 시작</button><p><small>현재 빌드는 임시 균등확률 추첨입니다. 최근 3개월 실제 당첨 이력 연동은 아직 미구현입니다.</small></p><h3>번호 기록</h3><textarea id="notes" placeholder="번호를 기록하세요" oninput="localStorage.setItem('notes',this.value)"></textarea><script>document.getElementById('notes').value=localStorage.getItem('notes')||'';function draw(){let a=Array.from({length:45},(_,i)=>i+1);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let nums=a.slice(0,6).sort((x,y)=>x-y);document.getElementById('balls').innerHTML=nums.map(n=>'<span class="ball">'+n+'</span>').join('');}draw();</script></body></html>
